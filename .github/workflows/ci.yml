name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The three bundled fixtures are two recorded failures, so this job is red
      # until they are re-recorded against a fixed agent. Kept non-blocking so
      # the suite runs on every PR and its report is always fresh.
      - run: |
          node packages/eval/bin/eval.mjs \
            --suite packages/eval/suites/demo.yaml \
            --runs "packages/eval/src/fixtures/*.json" \
            --junit eval-report.xml --no-color || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.xml
